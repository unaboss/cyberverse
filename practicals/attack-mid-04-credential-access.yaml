# Intermediate attack tower, floor 4. Credential access. The learner holds a
# root shell on the vending server. Root lets them read the account database and
# crack the weak passwords in it. Reused credentials are the key to the rest of
# the network, which is why this step comes before going deeper.

id: attack-mid-04-credential-access
title: "Credential access"
status: draft
role: predator
org: siyakhula
startTime: "11:00"
durationMin: 0
speed: 1
defender: { enabled: false }
foothold: vending
briefing: |
  You have a root shell on the vending server. Before you move on, you empty its
  pockets.

  A root shell can read the server's account database, where the passwords are
  stored as hashes. You dump them and crack the weak ones offline. People reuse
  passwords, so a credential that works here often works somewhere better.
guide:
  mentor: founder
  target: 12
  steps:
    - id: enter
      title: Step into the server
      say: Your foothold on the vending server is session 1. Step into it, so the commands you type run on the server.
      do: Interact with your session.
      hint: "Type `sessions -i 1` and press Enter. The prompt changes to the server."
      show: { tab: term }
      done: { command: { did: read, text: sessions } }

    - id: dump
      title: Dump the hashes
      say: Now read the stored account hashes and let the lab crack any that use a common password. This is where root pays off, because only root can read that file.
      do: Dump the credentials on the vending server.
      hint: "Type `hashdump` and press Enter."
      show: { tab: term }
      done: { command: { did: dump, of: vending } }
      praise: The tomcat account cracked on the spot — its password was "tomcat". A dumped hash with a weak password is a cracked login, and a cracked login is the next door.

    - id: reuse
      title: Why the hashes matter
      say: You now hold credentials that are not yours.
      do: Answer the question.
      hint: What do people do with passwords across different systems?
      ask:
        question: You cracked a password on this server. Why is that worth more than access to this one box?
        options:
          - text: People reuse passwords, so the same login often opens other machines — you try it across the network and move from box to box.
            correct: true
            reply: >-
              Yes. That is lateral movement, and credentials are its fuel. One
              cracked password, reused on the next server, lets you walk deeper
              without exploiting anything. You harvest, then you reuse.
          - text: It proves the vending server is insecure, and that is the whole value
            reply: That is one finding, but the real value is reach. A reused password turns this one box into a key for the next, which is how an attacker crosses a network.
          - text: Nothing more; a password only works on the machine it came from
            reply: If only that were true. People reuse passwords everywhere, so a credential from one box frequently opens the next. That reuse is exactly what you exploit.
      done: { answer: correct }
  outro:
    title: You hold their keys
    learned:
      - A root shell can read the machine's stored password hashes.
      - Weak passwords crack against a wordlist offline, turning a hash into a working login.
      - People reuse passwords, so a credential from one machine often opens others.
      - Harvesting credentials, then reusing them, is how an attacker moves across a network — lateral movement.
    next: "Floor 5: The crown jewels"
qcto: [KM-03-KT10, KM-03-KT11, KM-03-KT12, PM-02-PS02, PM-02-PS04, FA3.4]
