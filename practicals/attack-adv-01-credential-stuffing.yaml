# Advanced attack tower, floor 1. The cloud shop. Ikhaya's sign-in page has no
# bot protection, no breached-password check and no second factor, so lists of
# passwords leaked from other sites can be replayed at speed. The learner runs
# that attack against one account to show how a few in every thousand work.

id: attack-adv-01-credential-stuffing
title: "Credential stuffing the shop"
status: draft
role: predator
org: ikhaya
startTime: "09:30"
durationMin: 0
speed: 1
defender: { enabled: false }
briefing: |
  Start where the customers are. Ikhaya's online shop lets anyone try to sign in
  as many times as they like, from anywhere, with no second factor and no check
  against passwords that have leaked elsewhere.

  Attackers feed it email-and-password pairs leaked from other companies'
  breaches. People reuse passwords, so a few in every thousand simply work. You
  prove it against one known account.
guide:
  mentor: founder
  target: 12
  steps:
    - id: why
      title: Why guessing works at scale
      say: You are not cracking Ikhaya's own passwords. You are replaying passwords stolen from somewhere else entirely.
      do: Answer the question.
      hint: What makes a password leaked from another company useful here?
      ask:
        question: Why does trying leaked passwords against the shop work at all?
        options:
          - text: People reuse the same password across sites, so a pair leaked from another breach often unlocks the same person's account here.
            correct: true
            reply: >-
              Yes. That is credential stuffing. You are not breaking Ikhaya's
              security; you are cashing in on someone else's breach and on the
              fact that people reuse passwords. Volume does the rest.
          - text: The shop stores its passwords in plain text
            reply: You do not even need Ikhaya's stored passwords. Credential stuffing replays passwords leaked elsewhere, betting on reuse. That is what makes it cheap and effective.
          - text: Each guess cracks a little more of the password
            reply: Passwords are not cracked a letter at a time. Stuffing tries whole known passwords from other breaches, and reuse means some land on the first try.
      done: { answer: correct }

    - id: stuff
      title: Replay the list
      say: Take one account from a breach list and throw a wordlist of common and leaked passwords at the shop's sign-in. With no rate limit, you can try as fast as you like.
      do: Run the password attack against the shop sign-in.
      hint: "Type `hydra -l lerato -P rockyou.txt https://{ip:shop}` and press Enter."
      show: { tab: term }
      done: { command: { did: crack, of: shop, user: lerato } }
      praise: In. The account's password had leaked in another breach and was reused here. One hit, and with no bot protection you could run this against millions of pairs unnoticed.

    - id: fix
      title: What would have stopped you
      say: You got in without exploiting a single bug. So what is the defence?
      do: Answer the question.
      hint: Three controls, none of which is "a stronger password".
      ask:
        question: What would have stopped this attack?
        options:
          - text: A second factor, bot protection that slows and challenges automated sign-ins, and refusing passwords known to be breached.
            correct: true
            reply: >-
              Yes. A stolen password alone is useless against a second factor,
              bot protection kills the volume, and a breached-password check
              refuses the reused ones outright. That is the fix you write up.
          - text: Telling customers to choose longer passwords
            reply: Length does not help when the password was reused and already leaked. The fixes are a second factor, bot protection, and blocking known-breached passwords.
          - text: Nothing; if a password is correct, the login must succeed
            reply: A correct password from a stuffing run should still be challenged — by a second factor, by bot protection, by a breach check. That is exactly what Ikhaya is missing.
      done: { answer: correct }
  outro:
    title: You walked in the front door
    learned:
      - Credential stuffing replays passwords leaked from other breaches, betting that people reuse them.
      - With no rate limit or bot protection, an attacker can try millions of pairs at speed.
      - A single reused, breached password is enough to take over an account.
      - The defences are a second factor, bot protection, and refusing known-breached passwords — not just "stronger passwords".
    next: "Floor 2: The orders API"
qcto: [KM-03-KT07, KM-03-KT08, KM-08-KT04, PM-02-PS02, FA3.4]
