# Defend tower, floor 4. Built on 2026-11-21; the owner asked for floors 3 to
# 6 to be finished without a design round each.
#
# Somebody at 10.88.0.201 tries the CRM's admin account with a factory
# password, and the second try works: admin123, the password the CRM came
# with. This is the "crm-default-admin" weakness: the manual says default
# passwords are changed before a system goes live ("crm-hardening", in place),
# but in the lab nobody did it for the CRM.
#
# The learner reads the alert and the log, resets the admin password, blocks
# the address, switches on the control that should have stopped it, and says
# why a rule on paper didn't. MFA would also have stopped this login, so
# switching it on gets a reply that sends the learner on to the real cause.

id: defend-04-default-password
title: "The default password"
status: draft
role: prey
org: dataquant
startTime: "11:20"
durationMin: 0
speed: 1
controls: { cloud-ids: on }
map:
  rooms: [trust-risk, strategy-leadership, growth, data-insights, operations, offensive-security, academy]
  outside: [internet]
  perimeter: true
  note: The Academy trains our clients' staff. Every room you add is one more place a weak password can hide.
briefing: |
  Your fifth day at DataQuant. Today you can lock and reset accounts, and
  switch controls on and off.

  So far nobody has got in. That's about to change. Still no clock, and
  isolating machines stays locked.
guide:
  mentor: founder
  hold: [attack-surface-check]
  locked: { isolate: 5, release: 5, rebuild: 5 }
  steps:
    - id: got-in
      title: A login that worked
      say: >-
        Every alert so far was somebody knocking. Watch for one where the door
        opened.
      do: Wait for the alert, then open it.
      hint: Alerts land in the Alerts tab. This one is about the CRM.
      show: { tab: alerts, alert: hids-default-credentials }
      script:
        - { after: 4, event: guess, system: crm, user: admin, src: 10.88.0.201, tries: 2, every: 3, getsIn: true }
      done: { look: alert, rule: hids-default-credentials }
      praise: >-
        "Login with default credentials". Somebody logged in to the CRM with the
        password it came with from the factory. Anybody can look that up in the
        CRM's manual.

    - id: what-they-got
      title: How bad is it?
      say: >-
        Check the evidence before you act, but don't take long. Somebody is
        inside.
      do: Open the CRM, read its log, then answer.
      hint: The alert has an "Open machine" button. Look for "login ok" in the log.
      show: { host: crm }
      ask:
        question: What happened on the CRM?
        options:
          - text: "Somebody at 10.88.0.201 logged in as admin, after one wrong try"
            correct: true
            reply: >-
              Yes. One wrong guess, then admin123 worked. admin can see and
              change everything in the CRM: every client, every lead.
          - text: Every login failed, like on floor 1
            reply: >-
              Look again. The last line from 10.88.0.201 says "login ok". This
              time they got in.
          - text: "I logged in from my laptop"
            reply: >-
              Not me. My laptop is {ip:founder-laptop}. These logins came from
              10.88.0.201, on the internet.
      done: { answer: correct }

    - id: reset
      title: Change the password
      say: >-
        First, shut the door they came through. A new password means the one
        they know stops working.
      do: Reset the password of the admin account on the CRM.
      hint: >-
        In the CRM's machine window, type admin in the account box and press
        "Reset password".
      show: { host: crm }
      done: { action: reset, target: crm, user: admin }
      wrong: >-
        That's not the account they used. Reset admin on the CRM: that's the
        one with the factory password.
      praise: >-
        admin has a new, strong password. The one from the CRM's manual no
        longer works.

    - id: block
      title: Block them too
      say: >-
        They know where we are now. You learned this one yesterday.
      do: Block 10.88.0.201.
      hint: Open the alert and press "Block 10.88.0.201", or use the Blocks tab.
      show: { alert: hids-default-credentials }
      done: { action: block, target: 10.88.0.201 }
      wrong: >-
        That's not the address they came from. Unblock it, then block
        10.88.0.201.
      praise: Blocked. Two doors shut. Now for the reason the first one was open.

    - id: control
      title: Fix the cause
      say: >-
        Our manual says every new system gets its default passwords changed
        before it goes live. Somebody wrote that rule. Nobody checked it was
        done on the CRM.
      do: In the Controls tab, switch on the control that should have stopped this.
      hint: Look for the control about default passwords.
      show: { tab: controls }
      done: { action: control, target: crm-hardening }
      wrong: >-
        That control is useful, but it wouldn't have stopped a login with the
        right password. Look for the one about default passwords.
      replies:
        mfa-everywhere: >-
          Good thinking, and it's on now: a second factor would have stopped
          this login. But our rule says no system goes live with a factory
          password, and the CRM did. Switch on the control about default
          passwords too.
      praise: >-
        "Change default passwords on new systems" is on, and the CRM's factory
        password is gone for good, not just today.

    - id: why
      title: Why did it happen?
      say: >-
        Last question, and it's the one I'll ask you in every incident review.
      do: Answer the question.
      hint: The control was "in place" in our manual. Was it in place on the CRM?
      ask:
        question: Our manual says default passwords get changed. Why did this still happen?
        options:
          - text: The rule was written down, but nobody checked it was done on the CRM.
            correct: true
            reply: >-
              Exactly. A control on paper is a promise. Somebody has to check it
              was kept, on every system, or attackers will check for us.
          - text: The attacker was too clever to stop.
            reply: >-
              Not this one. They typed a password from the CRM's own manual. The
              cleverest part of the attack was that we left it there.
          - text: Default passwords are fine if nobody knows the system exists.
            reply: >-
              Scanners find every system on the internet within hours. Hiding
              isn't a control. Changing the password is.
      done: { answer: correct }
  outro:
    title: Floor 4 complete
    learned:
      - A login that worked is the alert that matters most. Act fast, but read the log first.
      - Reset the account they used, so the password they know stops working.
      - Then fix the cause, or it happens again tomorrow.
      - A control on paper is a promise. Check it was kept on every system.
    next: "Floor 5: The lure"
qcto: [KM-01-KT06, KM-03-KT07, PM-03-PS07, PM-03-PS08, PM-03-PS10, FA1.1, FA2.3, FA2.4, FA5.3]
