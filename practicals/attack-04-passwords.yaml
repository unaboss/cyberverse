# Intro attack tower, floor 4. Password attacks. The webmail faces the internet
# and takes a password alone, with no second factor. The learner runs an online
# brute force with hydra against a known mailbox and gets in, then learns the
# difference between online guessing and offline cracking with john.

id: attack-04-passwords
title: "Password attacks"
status: draft
role: predator
org: siyakhula
startTime: "10:30"
durationMin: 0
speed: 1
defender: { enabled: false }
briefing: |
  Weak passwords are still the way in more often than any clever exploit. The
  sweep found Siyakhula's webmail facing the internet, and their own policy
  admits staff reuse seasonal passwords.

  Today you attack passwords two ways. First online, guessing live logins with
  hydra. Then you learn why offline cracking, with a tool like john, is the
  more dangerous cousin.
guide:
  mentor: founder
  target: 15
  steps:
    - id: online
      title: Two ways to attack a password
      say: There are two. Online, you try passwords against the live service, like someone typing at the login page very fast. Offline, you steal the scrambled password file and crack it on your own machine.
      do: Answer the question.
      hint: Which one is hydra, hammering a live login?
      ask:
        question: What does hydra do?
        options:
          - text: It tries a list of passwords against a live service, one login attempt after another, until one works.
            correct: true
            reply: >-
              Yes. That is an online brute force. It is noisy and slow, and it
              can lock accounts out — but against a service with no lockout and
              no second factor, it just works.
          - text: It cracks a stolen password hash offline
            reply: That is john or hashcat. Hydra attacks the live service directly, over the network.
          - text: It finds open ports
            reply: That is nmap. Hydra guesses passwords against a service you already found.
      done: { answer: correct }

    - id: hydra
      title: Guess a webmail login
      say: The webmail takes a username and password from anywhere, with no second factor. Point hydra at it with a known mailbox and the common-password list.
      do: Brute force the webmail login for the mailbox "kagiso".
      hint: "Type `hydra -l kagiso -P rockyou.txt https://{ip:mail}` and press Enter."
      show: { tab: term }
      done: { command: { did: crack, of: mail, user: kagiso } }
      praise: In. A seasonal password from the list, and the webmail let it straight through from the internet. That mailbox is now yours, and the report will say so.

    - id: why
      title: Why it worked
      say: That should not have been possible from the internet. Three things made it easy.
      do: Answer the question.
      hint: Think about the password, the second factor, and what happens after many wrong tries.
      ask:
        question: Which control would have stopped this best?
        options:
          - text: Multi-factor authentication — a one-time code as well as the password, so a guessed password alone is not enough.
            correct: true
            reply: >-
              Yes. MFA would have stopped it dead. A lockout after a few wrong
              tries and a ban on seasonal passwords would help too, but MFA is
              the one that closes an internet-facing login like this.
          - text: A faster server
            reply: Speed has nothing to do with it. The login accepted a guessable password with no second factor. That is the hole.
          - text: Nothing could have stopped it
            reply: Plenty could. MFA alone would have stopped it, and lockout and a password policy would have made the guessing far harder.
      done: { answer: correct }

    - id: offline
      title: The dangerous cousin
      say: Later in the test you copy a file of scrambled password hashes off a server. Hydra is no use on a file. This is where john the ripper comes in.
      do: Answer the question.
      hint: On your own machine, with a stolen hash, what limits you?
      ask:
        question: Why is offline cracking with john more dangerous than online guessing?
        options:
          - text: It runs on your own machine against a stolen hash, so there is no network, no lockout and no one watching — billions of guesses a second.
            correct: true
            reply: >-
              Yes. Online, the service can lock you out and the SOC can see you.
              Offline, none of that applies. It is why a stolen password file is
              so serious, and why strong hashing and long passwords matter.
          - text: It is faster to type
            reply: It is not about typing. Offline, nothing throttles or watches you, so you can try far more guesses than any live service allows.
          - text: It is actually safer for the defender
            reply: The opposite. Once the hashes are stolen, the defender has no lockout and no visibility to protect them.
      done: { answer: correct }
  outro:
    title: You cracked the login
    learned:
      - Weak passwords remain the most common way in.
      - Online brute force (hydra) tries passwords against a live service and is noisy.
      - MFA is the control that best stops an internet-facing login guess; lockout and a password policy help.
      - Offline cracking (john) runs against a stolen hash with no network, no lockout and no watcher.
      - A stolen password file is a serious finding because offline cracking has no limits.
    next: "Floor 5: Exploitation and impact"
qcto: [KM-03-KT07, KM-02-KT04, KM-03-KT08, PM-02-PS02, FA3.4]
